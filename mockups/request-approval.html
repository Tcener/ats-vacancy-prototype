<!doctype html>
<!-- Что это за экран и как он связан с ТЗ: docs/reference/screens/request.md

     Единственная страница переноса, живущая ВНЕ приложения. Согласующий
     получает ссылку вида /request/vacancy/<токен> и открывает её без входа
     в систему: ни авторизации, ни проверки личности здесь нет. Поэтому
     ни сайдбара, ни шапки приложения — только логотип и белый лист.

     Состояния адресуются хешем:
       request-approval.html            — решение ещё не принято
       request-approval.html#confirm    — подтверждение согласования
       request-approval.html#approved   — согласовано
       request-approval.html#rejected   — отклонено -->
